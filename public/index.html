<style>
  :root {
    --tekst: #1F2933;
    --gedempt: #6B7580;
    --lijn: #E3E7EB;
    --groen: #2F8F5B;
    --lichtgroen: #E8F5EE;
    --rood: #B23A3A;
    --oranje: #A85B00;
    --lichtoranje: #FBF0E1;
    --lichtrood: #FBEBEB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #FFFFFF;
    color: var(--tekst);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
  }
  .col {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }
  h1 {
    font-size: 26px;
    font-weight: 600;
    margin: 16px 0 2px;
    overflow-wrap: anywhere;
  }
  .label {
    font-size: 14px;
    color: var(--gedempt);
    display: block;
    margin: 20px 0 6px;
  }
  input[type="text"], input[type="time"] {
    font: inherit;
    color: inherit;
    border: 1px solid var(--lijn);
    border-radius: 8px;
    padding: 12px;
    min-height: 44px;
    background: #fff;
    width: 100%;
  }
  input:focus {
    outline: none;
    border-color: var(--groen);
    box-shadow: 0 0 0 1px var(--groen);
  }
  button {
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    min-height: 44px;
    cursor: pointer;
    background: var(--groen);
    color: #fff;
  }
  button:disabled {
    background: var(--lijn);
    color: var(--gedempt);
    cursor: default;
  }
  button.sec {
    background: none;
    color: var(--groen);
    padding: 12px 8px;
  }
  button.klein {
    padding: 8px 14px;
    min-height: 44px;
    font-size: 15px;
  }
  .fout {
    color: var(--rood);
    font-size: 15px;
    margin: 10px 0 0;
  }
  .fade { animation: fade .15s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* vlaggetje */
  .kop { display: flex; align-items: flex-start; position: relative; min-height: 44px; }
  #vlag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    padding: 0 8px 0 0;
    height: 44px;
    min-height: 44px;
    color: var(--tekst);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  #vlag svg { color: var(--groen); }
  #talen {
    position: absolute;
    top: 46px;
    inset-inline-start: 0;
    background: #fff;
    border: 1px solid var(--lijn);
    border-radius: 10px;
    padding: 6px;
    z-index: 5;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    min-width: 300px;
    max-width: calc(100vw - 32px);
    max-height: min(70vh, 520px);
    overflow-y: auto;
    box-shadow: 0 6px 20px rgba(31, 41, 51, .10);
  }
  #talen button {
    display: block;
    width: 100%;
    text-align: start;
    background: none;
    color: var(--tekst);
    font-weight: 400;
    font-size: 15px;
    padding: 10px 12px;
    white-space: nowrap;
    border-radius: 8px;
  }
  #talen button:hover { background: var(--lichtgroen); }
  #talen button.actief { background: var(--lichtgroen); font-weight: 600; }

  /* deelbalk */
  .deel {
    background: var(--lichtgroen);
    border-radius: 8px;
    padding: 12px;
    margin: 16px 0 0;
    font-size: 15px;
  }
  .deel .url { user-select: all; word-break: break-all; display: block; margin: 4px 0 8px; }

  /* titel aanpassen */
  .titelrij button.sec { font-size: 13px; color: var(--gedempt); padding: 4px 0; min-height: 44px; text-decoration: underline; font-weight: 400; }
  .titeleditor { display: flex; gap: 8px; margin: 12px 0 4px; }

  /* statusblok */
  .status { margin: 12px 0 4px; }
  .status .balk {
    background: var(--lichtgroen);
    border-radius: 8px;
    padding: 14px;
  }
  .status .balk .groot { font-size: 20px; font-weight: 600; color: var(--groen); }
  .status .balk.groen  { background: var(--lichtgroen); }
  .status .balk.groen  .groot { color: var(--groen); }
  .status .balk.oranje { background: var(--lichtoranje); }
  .status .balk.oranje .groot { color: var(--oranje); }
  .status .balk.rood   { background: var(--lichtrood); }
  .status .balk.rood   .groot { color: var(--rood); }
  .status .balk.definitief { border-inline-start: 3px solid var(--groen); }
  .status .groot { font-size: 20px; font-weight: 600; color: var(--groen); }
  .status .sub { font-size: 14px; color: var(--gedempt); margin-top: 2px; }
  .status .stil { color: var(--gedempt); }
  .status .rijtje { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .status .knopzone { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .status input[type="time"] { width: auto; min-width: 7.5em; max-width: 100%; padding: 8px; min-height: 44px; font-size: 15px; }
  .namenlijn { font-size: 14px; color: var(--gedempt); margin-top: 2px; }

  /* stipjes en vinkjes per persoon */
  .stip { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-inline-end: 5px; vertical-align: baseline; }
  .naampje { display: inline-flex; align-items: center; margin-inline-end: 10px; white-space: nowrap; }

  /* wie ben je + gekleurde naamchips */
  .wie { font-size: 15px; margin: 16px 0 0; }
  .wie b { font-weight: 600; unicode-bidi: isolate; }
  .wie button.sec { padding: 4px 6px; min-height: 44px; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: none;
    border: 1px solid var(--lijn);
    border-radius: 22px;
    color: var(--tekst);
    font-weight: 400;
    padding: 8px 14px;
    min-height: 44px;
  }
  .chip .stip { margin-inline-end: 0; }
  .chip { max-width: 100%; }
  .chip bdi { overflow-wrap: anywhere; }
  .chip.ik { border-color: var(--groen); background: var(--lichtgroen); font-weight: 600; }
  .nieuw { display: flex; gap: 8px; margin-top: 8px; }

  /* kalender */
  .kal { margin: 6px 0 4px; }
  .kal.inactief .dag { opacity: .5; }
  .kalkop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .kalkop .mnd { font-weight: 600; }
  .kalkop button { background: none; color: var(--groen); font-size: 22px; padding: 4px 16px; }
  .maanden { display: flex; flex-wrap: wrap; gap: 20px; }
  .maandblok { flex: 1 1 240px; min-width: 0; }
  .maandnaam { font-weight: 600; text-align: center; margin-bottom: 4px; }
  .kalgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .kalwd { font-size: 12px; color: var(--gedempt); text-align: center; padding: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dag {
    min-height: 50px;
    border: 1px solid var(--lijn);
    border-radius: 8px;
    background: #fff;
    color: var(--tekst);
    font-weight: 400;
    padding: 4px 2px 3px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 1px;
    line-height: 1.2;
  }
  .dag.leeg { border: none; background: none; cursor: default; }
  .dag.vandaag { border-color: var(--gedempt); }
  .dag.optie { border-color: var(--groen); }
  .dag.mijn { background: var(--lichtgroen); border-color: var(--groen); font-weight: 600; }
  .dag.definitief { box-shadow: inset 3px 0 0 var(--groen); }
  [dir="rtl"] .dag.definitief { box-shadow: inset -3px 0 0 var(--groen); }
  [dir="rtl"] .kalkop button { transform: scaleX(-1); }
  .ddots { display: flex; align-items: center; justify-content: center; gap: 3px; min-height: 12px; flex-wrap: wrap; }
  .ddot { width: 7px; height: 7px; border-radius: 50%; }
  .dvink { font-size: 11px; font-weight: 700; line-height: 1; }
  .dmeer { font-size: 10px; color: var(--gedempt); line-height: 1; }

  .taplijn { font-size: 14px; color: var(--gedempt); margin: 8px 0 0; min-height: 21px; }
  .taplijn .wanneer { color: var(--tekst); font-weight: 600; }

  /* weggaan */
  .weg { margin-top: 40px; font-size: 13px; }
  .weg button {
    background: none;
    color: var(--gedempt);
    font-size: 13px;
    font-weight: 400;
    padding: 8px 0;
    text-decoration: underline;
  }
  .weg .bevestig button { margin-inline-end: 8px; text-decoration: none; }
  .weg .bevestig button.ja { color: var(--rood); }

  .bezoek {
    margin-top: 28px;
    font-size: 13px;
    color: var(--gedempt);
  }
  .voet {
    margin-top: 20px;
    font-size: 13px;
    color: var(--gedempt);
  }
  .verborgen { display: none !important; }

  /* lettertypen per schrift (systeemfonts, niets extern) */
  :lang(ar), :lang(ur) { font-family: "Segoe UI", "Noto Naskh Arabic", "Noto Sans Arabic", "Geeza Pro", Tahoma, Arial, sans-serif; }
  :lang(ur) { line-height: 1.8; }
  :lang(hi) { font-family: "Nirmala UI", "Noto Sans Devanagari", "Kohinoor Devanagari", Mangal, Arial, sans-serif; }
  :lang(bn) { font-family: "Nirmala UI", "Noto Sans Bengali", "Kohinoor Bangla", Vrinda, Arial, sans-serif; }
  :lang(zh) { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
  :lang(ja) { font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, "Noto Sans CJK JP", "Noto Sans JP", sans-serif; }
  :lang(ko) { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans CJK KR", "Noto Sans KR", sans-serif; }
  :lang(ar) .dmeer, :lang(ur) .dmeer, :lang(hi) .dmeer, :lang(bn) .dmeer { font-size: 11px; }
  :lang(ur) .dag, :lang(ar) .dag { line-height: 1.4; }

  /* boodschapsbalken (update / installeren) bovenaan */
  .melding {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    border-radius: 8px;
    padding: 12px 14px;
    margin: 0 0 12px;
    font-size: 15px;
  }
  .melding .tekst { flex: 1 1 auto; min-width: 140px; }
  .melding.update { background: var(--lichtoranje); color: var(--oranje); }
  .melding.install { background: var(--lichtgroen); color: var(--tekst); }
  .melding button.klein { flex: 0 0 auto; }
  .melding .sluit {
    background: none; color: inherit; opacity: .6;
    font-size: 18px; padding: 0 6px; min-height: 44px; width: 36px; font-weight: 400;
  }

  /* tagline op de startpagina */
  .tagline { color: var(--gedempt); font-size: 15px; margin: 0 0 4px; }

  /* legenda onder de kalender */
  .legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--gedempt); margin: 8px 0 0; }
  .legenda span { display: inline-flex; align-items: center; gap: 6px; }
  .legenda .vk { color: var(--groen); font-weight: 700; }
  .legenda .dt { width: 8px; height: 8px; border-radius: 50%; background: var(--gedempt); display: inline-block; }

  /* voorbije dagen gedimd (nog klikbaar, we blokkeren niets) */
  .dag.verleden span:first-child { color: var(--gedempt); }
  .dag.verleden { border-style: dashed; }
  .dag.verleden.mijn, .dag.verleden.optie { border-style: solid; }

  /* doneren — licht en vrolijk */
  .doneer { margin-top: 22px; }
  .doneer-knop {
    background: none; border: 1px solid var(--groen); color: var(--groen);
    border-radius: 22px; padding: 8px 20px; min-height: 44px; font-size: 15px; font-weight: 600;
  }
  .doneer-paneel {
    margin-top: 12px; background: var(--lichtgroen); border: none;
    border-radius: 16px; padding: 18px; max-width: 400px;
    animation: fade .18s ease-out;
  }
  .doneer-intro { font-size: 15px; color: var(--tekst); margin: 0 0 14px; line-height: 1.45; }
  .doneer-rij { display: flex; flex-wrap: wrap; gap: 10px; }
  .doneer-bedrag {
    background: var(--groen); border: none; color: #fff;
    border-radius: 12px; padding: 12px 20px; min-height: 48px; min-width: 62px;
    font-weight: 700; font-size: 17px;
    text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 2px rgba(47,143,91,.25); transition: transform .1s ease, filter .1s ease;
  }
  .doneer-bedrag:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .doneer-bedrag:active { transform: translateY(0); }
  .doneer-joke { font-size: 14px; color: var(--gedempt); margin: 16px 0 8px; }
  .doneer-vrij { display: inline-block; margin-top: 14px; color: var(--groen); text-decoration: underline; font-size: 14px; }
</style>
</head>
<body>
<div class="col">
  <div class="melding update verborgen" id="updateBar">
    <span class="tekst" id="updateTekst"></span>
    <button class="klein" id="updateBtn" type="button"></button>
  </div>
  <div class="melding install verborgen" id="installBar">
    <span class="tekst" id="installTekst"></span>
    <button class="klein" id="installBtn" type="button"></button>
    <button class="sluit" id="installSluit" type="button" aria-label="Close">×</button>
  </div>
  <div class="kop">
    <button id="vlag" type="button"></button>
    <div id="talen" class="verborgen"></div>
  </div>
  <div id="scherm"></div>
  <div id="doneer" class="doneer verborgen">
    <button id="doneerBtn" class="doneer-knop" type="button"></button>
    <div id="doneerPaneel" class="doneer-paneel verborgen"></div>
  </div>
  <p class="voet" id="voet"></p>
</div>

};
const BRAND = 'Whenly';
// Wordt bij het deployen vervangen door het korte git-commitnummer.
const VERSION = '__VERSION__';
const VERSIE = VERSION.startsWith('__') ? 'dev' : VERSION;
// PayPal voor de donatieknop: PayPal.me-naam (of e-mailadres). Leeg = verborgen.
const PAYPAL = 'ABoullbahaiem';
// Eén vaste kleur per persoon (volgorde van binnenkomst), goed leesbaar op wit.
const KLEUREN = ['#0072B2', '#E69F00', '#009E73', '#CC79A7', '#D55E00', '#56B4E9', '#8E63C6', '#6B7580'];
const LS = {
  name: 'prikdatum.name',
  lang: 'prikdatum.lang',
  p: (id) => 'prikdatum.p.' + id,          // je eigen deelnemer (blijft bewaard)
  act: (id) => 'prikdatum.act.' + id,      // tijdelijk: aanklikken namens iemand anders
  visited: (id) => 'prikdatum.v.' + id,    // deze browser telde al één bezoek
  just: 'prikdatum.justCreated',
};

/* ---------- taal en regio bepalen ---------- */
function browserTalen() {
  const lijst = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
  return Array.from(lijst, (x) => String(x));
}
function basisTaal(tag) {
  const b = tag.toLowerCase().split('-')[0];
  return TALEN[b] ? b : null;
}
// Eerst de bewaarde keuze, dan de talen van de browser op volgorde van voorkeur, anders Engels.
function bepaalTaal() {
  try {
    const opgeslagen = localStorage.getItem(LS.lang);
    if (opgeslagen && TALEN[opgeslagen]) return opgeslagen;
  } catch {}
  for (const tag of browserTalen()) {
    const b = basisTaal(tag);
    if (b) return b;
  }
  return 'en';
}
// Datumlocale: de regio van de browser als die bij de taal hoort (en-US, pt-BR,
// ar-SA ...), anders de standaardregio van de taal.
function bepaalLocale(lang) {
  for (const tag of browserTalen()) {
    if (basisTaal(tag) === lang && tag.includes('-')) return tag;
  }
  return TALEN[lang].locale;
}
// Voor Intl: altijd de Gregoriaanse kalender en Latijnse cijfers, want het
// kalenderraster en de ingetypte uren zijn dat ook.
function datumLocale() {
  const l = state.locale;
  try { new Intl.DateTimeFormat(l); } catch { return TALEN[state.lang].locale + '-u-ca-gregory-nu-latn'; }
  return l.includes('-u-') ? l : l + '-u-ca-gregory-nu-latn';
}
// Eerste dag van de week: 1 = maandag ... 7 = zondag. Via Intl als de browser
// dat kent, anders een tabel per regio (CLDR).
const WEEK_ZONDAG = new Set('AG AS BD BR BS BT BW BZ CA CO DM DO ET GT GU HK HN ID IL IN JM JP KE KH KR LA MH MM MO MT MX MZ NI NP PA PE PH PK PR PY SA SG SV TH TT TW UM US VE VI WS YE ZA ZW'.split(' '));
const WEEK_ZATERDAG = new Set('AE AF BH DJ DZ EG IQ IR JO KW LY OM QA SD SY'.split(' '));
function eersteWeekdag() {
  let regio = '';
  try {
    const loc = new Intl.Locale(state.locale);
    const wi = typeof loc.getWeekInfo === 'function' ? loc.getWeekInfo() : loc.weekInfo;
    if (wi && wi.firstDay >= 1 && wi.firstDay <= 7) return wi.firstDay;
    regio = (loc.maximize().region || '').toUpperCase();
  } catch {}
  if (WEEK_ZONDAG.has(regio)) return 7;
  if (WEEK_ZATERDAG.has(regio)) return 6;
  return 1;
}

const state = {
  lang: bepaalTaal(),
  locale: null,        // wordt hieronder gezet (hangt af van lang)
  pollId: null,
  data: null,
  lastJson: '',
  own: null,           // je eigen deelnemer-id in deze browser
  me: null,            // namens wie je nu aanklikt (meestal = own)
  inflight: 0,
  kalMaand: null,
  titelEdit: false,
  nieuwOpen: false,
  tapDag: null,
};
state.locale = bepaalLocale(state.lang);

function heeftTekst(sleutel) { return sleutel in VERTALINGEN.en; }

function t(sleutel, vars) {
  const taal = VERTALINGEN[state.lang] || VERTALINGEN.en;
  let s = taal[sleutel];
  if (s === undefined) s = VERTALINGEN.en[sleutel];
  if (s === undefined) s = sleutel;
  if (typeof s === 'object') {
    // meervoudsvormen: kies op basis van {n}
    const n = vars && vars.n !== undefined ? Number(vars.n) : 0;
    let vorm = 'other';
    try { vorm = new Intl.PluralRules(state.locale).select(n); } catch {}
    s = s[vorm] !== undefined ? s[vorm] : (s.other !== undefined ? s.other : Object.values(s)[0]);
  }
  if (vars) for (const k of Object.keys(vars)) s = s.replaceAll('{' + k + '}', String(vars[k]));
  return s;
}

// 'HH:MM' -> per regio (18:00, 6:00 PM, 18.00 ...)
function fmtTijd(tijd) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(tijd || '');
  if (!m) return tijd || '';
  try {
    return new Intl.DateTimeFormat(datumLocale(), { hour: 'numeric', minute: '2-digit' })
      .format(new Date(2024, 0, 1, Number(m[1]), Number(m[2])));
  } catch { return tijd; }
}

function fmtDatum(datum, tijd) {
  const d = new Date(datum + 'T12:00:00');
  const opties = { weekday: 'short', day: 'numeric', month: 'short' };
  if (d.getFullYear() !== new Date().getFullYear()) opties.year = 'numeric';
  let s = new Intl.DateTimeFormat(datumLocale(), opties).format(d);
  if (tijd) s += ' ' + t('poll.at', { time: fmtTijd(tijd) });
  return s;
}

function isoDag(d) {
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dag = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + dag;
}

function el(tag, cls, tekst) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (tekst !== undefined) n.textContent = tekst;
  return n;
}
// Naam of titel van een gebruiker: geïsoleerd, zodat een Arabische naam in een
// Nederlandse zin (of omgekeerd) de leestekens niet laat verspringen.
function bdi(tekst) { return el('bdi', null, tekst); }

async function api(pad, methode, body) {
  const res = await fetch('/api' + pad, {
    method: methode || 'GET',
    headers: body !== undefined ? { 'Content-Type': 'application/json' } : undefined,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch {}
  return { ok: res.ok, status: res.status, data };
}

function foutTekst(data) {
  const code = data && data.error;
  return heeftTekst('err.' + code) ? t('err.' + code) : t('err.generic');
}

function wereldbol() {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', '22');
  svg.setAttribute('height', '22');
  svg.setAttribute('aria-hidden', 'true');
  const vorm = (tag, attrs) => {
    const n = document.createElementNS(ns, tag);
    for (const k of Object.keys(attrs)) n.setAttribute(k, attrs[k]);
    n.setAttribute('fill', 'none');
    n.setAttribute('stroke', 'currentColor');
    n.setAttribute('stroke-width', '1.8');
    return n;
  };
  svg.append(
    vorm('circle', { cx: 12, cy: 12, r: 9 }),
    vorm('ellipse', { cx: 12, cy: 12, rx: 4, ry: 9 }),
    vorm('line', { x1: 3, y1: 12, x2: 21, y2: 12 }),
  );
  return svg;
}

  /* --- kalenderklik: dag aan/uit --- */
  async function klikDag(datum) {
    if (!state.me) { naamIn.focus(); return; }
    state.tapDag = datum;
    lijstFout.classList.add('verborgen');
    const d = state.data;
    const opt = d.options.find((o) => o.date === datum);
    const vorige = structuredClone(d);
    state.inflight++;
    try {
      if (!opt) {
        d.options.push({ id: '_tmp', date: datum, time: null, addedBy: state.me, votes: [state.me] });
        d.options.sort((a, b) => a.date < b.date ? -1 : 1);
        render();
        const r = await api('/polls/' + pollId + '/options', 'POST', {
          participantId: state.me, date: datum, time: null,
        });
        if (!r.ok && (!r.data || r.data.error !== 'duplicate_option')) throw r;
      } else if (opt.votes.includes(state.me)) {
        if (opt.votes.length === 1) {
          d.options = d.options.filter((o) => o.id !== opt.id);
          if (d.finalOptionId === opt.id) d.finalOptionId = null;
          render();
          const r = await api('/polls/' + pollId + '/options/' + opt.id + '?participantId=' + encodeURIComponent(state.me), 'DELETE');
          if (!r.ok) throw r;
        } else {
          opt.votes = opt.votes.filter((v) => v !== state.me);
          render();
          const set = d.options.filter((o) => o.votes.includes(state.me)).map((o) => o.id);
          const r = await api('/polls/' + pollId + '/participants/' + state.me + '/votes', 'PUT', { optionIds: set });
          if (!r.ok) throw r;
        }
      } else {
        opt.votes.push(state.me);
        render();
        const set = d.options.filter((o) => o.votes.includes(state.me)).map((o) => o.id);
        const r = await api('/polls/' + pollId + '/participants/' + state.me + '/votes', 'PUT', { optionIds: set });
        if (!r.ok) throw r;
      }
      state.lastJson = '';
    } catch (r) {
      state.data = vorige;
      state.lastJson = '';
      render();
      lijstFout.textContent = foutTekst(r && r.data);
      lijstFout.classList.remove('verborgen');
    } finally {
      state.inflight--;
    }
    await haalOp(true);
  }

  async function zetTijd(optionId, tijd) {

      lijstFout.classList.remove('verborgen');
    } finally {
      state.inflight--;

      await api('/polls/' + pollId + '/final', 'PUT', { optionId });

  /* --- namen met kleurstip, "jij" eerst --- */
  function namenMetKleur(o) {
    const houder = el('span');
    const volgorde = [];
    if (state.me && o.votes.includes(state.me)) volgorde.push(state.me);
    for (const p of state.data.participants) {
      if (p.id !== state.me && o.votes.includes(p.id)) volgorde.push(p.id);
    }
    if (!volgorde.length) {
      houder.append(el('span', null, t('poll.nobody')));
      return houder;
    }
    const naamVan = new Map(state.data.participants.map((p) => [p.id, p.name]));
    for (const pid of volgorde) {
      const stukje = el('span', 'naampje');
      const stip = el('span', 'stip');
      stip.style.background = kleurVan(pid);
      stukje.append(stip, pid === state.me ? el('span', null, t('poll.you')) : bdi(naamVan.get(pid)));
      houder.append(stukje);
    }
    return houder;
  }

  function tijdVeld(o) {
    const tijd = el('input');
    tijd.type = 'time';
    tijd.value = o.time || '';
    tijd.dataset.oid = o.id;
    tijd.title = t('time.label');
    tijd.setAttribute('aria-label', t('time.label'));
    tijd.addEventListener('change', () => zetTijd(o.id, tijd.value));
    return tijd;
  }

  /* --- statusblok --- */
  function bouwStatus() {
    const actief = document.activeElement;
    const focusOid = actief && actief.dataset ? actief.dataset.oid : null;
    statusBlok.textContent = '';
    const d = state.data;
    const n = d.participants.length;
    const perId = new Map(d.options.map((o) => [o.id, o]));
    const blok = el('div', 'fade');

    const definitief = d.finalOptionId && perId.get(d.finalOptionId);
    if (definitief) {
      // een vastgelegde datum is altijd groen
      const balk = el('div', 'balk groen definitief');
      balk.append(el('div', 'groot', '✓ ' + t('status.final', { date: fmtDatum(definitief.date, definitief.time) })));
      balk.append(el('div', 'sub', t('status.count', { n: definitief.votes.length, total: n })));
      const namen = el('div', 'namenlijn');
      namen.append(namenMetKleur(definitief));
      balk.append(namen);
      const zone = el('div', 'knopzone');
      const los = el('button', 'sec klein', t('status.unfix')); los.type = 'button';
      los.addEventListener('click', () => zetFinal(null));
      zone.append(tijdVeld(definitief), los);
      balk.append(zone);
      blok.append(balk);
    } else {
      const max = d.options.reduce((m, o) => Math.max(m, o.votes.length), 0);
      if (n === 0 || max === 0) {
        // stoplicht ROOD: nog absoluut geen datum
        const balk = el('div', 'balk rood');
        balk.append(el('div', 'groot', t('status.none')));
        blok.append(balk);
      } else {
        // stoplicht: GROEN als iedereen kan, anders ORANJE
        const iedereen = max === n; // n >= 1 hier gegarandeerd
        const top = d.options.filter((o) => o.votes.length === max);
        const balk = el('div', 'balk ' + (iedereen ? 'groen' : 'oranje'));
        if (top.length === 1) {
          const o = top[0];
          balk.append(el('div', 'groot', t(iedereen ? 'status.everyone' : 'status.almost', { date: fmtDatum(o.date, o.time) })));
          balk.append(el('div', 'sub', t('status.count', { n: max, total: n })));
          const namen = el('div', 'namenlijn');
          namen.append(namenMetKleur(o));
          balk.append(namen);
          const zone = el('div', 'knopzone');
          const vast = el('button', 'sec klein', t('status.fix')); vast.type = 'button';
          vast.addEventListener('click', () => zetFinal(o.id));
          zone.append(tijdVeld(o), vast);
          balk.append(zone);
        } else {
          balk.append(el('div', 'groot', t(iedereen ? 'status.tieEveryone' : 'status.tie')));
          balk.append(el('div', 'sub', t('status.tieCount', { n: max, total: n })));
          for (const o of top) {
            const rij = el('div', 'rijtje');
            const links = el('span');
            links.append(el('span', null, fmtDatum(o.date, o.time)));
            const namen = el('span', 'namenlijn');
            namen.style.display = 'block';
            namen.append(namenMetKleur(o));
            links.append(namen);
            const neem = el('button', 'sec klein', t('status.pick')); neem.type = 'button';
            neem.addEventListener('click', () => zetFinal(o.id));
            rij.append(links, neem);
            balk.append(rij);
          }
        }
        blok.append(balk);
      }
    }
    statusBlok.append(blok);
    if (focusOid) {
      const terug = statusBlok.querySelector('input[data-oid="' + focusOid + '"]');
      if (terug) terug.focus({ preventScroll: true });
    }
  }

  /* --- kalender: twee maanden tegelijk --- */
  function maandBlok(m, perDag, vandaag) {
    const d = state.data;
    const locale = datumLocale();
    const blok = el('div', 'maandblok');
    blok.append(el('div', 'maandnaam', new Intl.DateTimeFormat(locale, { month: 'long', year: 'numeric' }).format(m)));

    const grid = el('div', 'kalgrid');
    // weekstart per regio (ma in Europa, zo in de VS/India/Japan, za in Egypte ...)
    const eersteDag = eersteWeekdag(); // 1 = ma ... 7 = zo
    const maandag = new Date(2024, 0, 1); // een maandag
    // Arabisch: de "korte" weekdag is de volledige naam, dus daar één letter (zoals Arabische kalenders doen)
    const wdVorm = state.lang === 'ar' ? 'narrow' : 'short';
    for (let i = 0; i < 7; i++) {
      const wd = new Date(maandag); wd.setDate(maandag.getDate() + (eersteDag - 1) + i);
      const cel = el('div', 'kalwd', new Intl.DateTimeFormat(locale, { weekday: wdVorm }).format(wd));
      cel.title = new Intl.DateTimeFormat(locale, { weekday: 'long' }).format(wd);
      grid.append(cel);
    }
    const eerste = new Date(m.getFullYear(), m.getMonth(), 1);
    const start = (eerste.getDay() - (eersteDag % 7) + 7) % 7; // 0 = valt op de eerste kolom
    const dagen = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    for (let i = 0; i < start; i++) grid.append(el('div', 'dag leeg'));
    for (let dag = 1; dag <= dagen; dag++) {
      const datum = m.getFullYear() + '-' + String(m.getMonth() + 1).padStart(2, '0') + '-' + String(dag).padStart(2, '0');
      const opt = perDag.get(datum);
      const mijn = !!(opt && state.me && opt.votes.includes(state.me));
      const b = el('button', 'dag'); b.type = 'button';
      if (datum < vandaag) b.classList.add('verleden');
      if (datum === vandaag) b.classList.add('vandaag');
      if (opt) b.classList.add('optie');
      if (mijn) b.classList.add('mijn');
      if (opt && d.finalOptionId === opt.id) b.classList.add('definitief');
      b.dataset.date = datum;
      b.append(el('span', null, String(dag)));
      // stipjes: wie kan er die dag (jij als vinkje in jouw kleur)
      const dots = el('span', 'ddots');
      if (opt) {
        const volgorde = [];
        if (mijn) volgorde.push(state.me);
        for (const p of d.participants) {
          if (p.id !== state.me && opt.votes.includes(p.id)) volgorde.push(p.id);
        }
        const toon = volgorde.slice(0, 4);
        for (const pid of toon) {
          if (pid === state.me) {
            const v = el('span', 'dvink', '✓');
            v.style.color = kleurVan(pid);
            dots.append(v);
          } else {
            const s = el('span', 'ddot');
            s.style.background = kleurVan(pid);
            dots.append(s);
          }
        }
        if (volgorde.length > 4) dots.append(el('span', 'dmeer', '+' + (volgorde.length - 4)));
      }
      b.append(dots);
      b.addEventListener('click', () => klikDag(datum));
      grid.append(b);
    }
    blok.append(grid);
    return blok;
  }

  function bouwKal() {
    kal.textContent = '';
    kal.classList.toggle('inactief', !state.me);
    const d = state.data;
    const perDag = new Map(d.options.map((o) => [o.date, o]));
    const locale = datumLocale();
    const m0 = state.kalMaand;
    const m1 = new Date(m0.getFullYear(), m0.getMonth() + 1, 1);
    const vandaag = isoDag(new Date());

    const kop = el('div', 'kalkop');
    const terug = el('button', null, '‹'); terug.type = 'button';
    terug.setAttribute('aria-label', t('cal.prev'));
    // in de kop de reeks (bv. "oktober – november 2026"); id/data voor navigatie
    const mnd = el('span', 'mnd');
    mnd.id = 'kalmaand';
    mnd.dataset.maand = m0.getFullYear() + '-' + String(m0.getMonth() + 1).padStart(2, '0');
    // formatRange kent de conventies per taal ("oktober – november 2026", "2026年10月～11月")
    const fmtM = new Intl.DateTimeFormat(locale, { month: 'long', year: 'numeric' });
    try {
      mnd.textContent = fmtM.formatRange(m0, m1);
    } catch {
      mnd.textContent = fmtM.format(m0) + ' – ' + fmtM.format(m1);
    }
    const verder = el('button', null, '›'); verder.type = 'button';
    verder.setAttribute('aria-label', t('cal.next'));
    terug.addEventListener('click', () => { state.kalMaand = new Date(m0.getFullYear(), m0.getMonth() - 1, 1); bouwKal(); });
    verder.addEventListener('click', () => { state.kalMaand = new Date(m0.getFullYear(), m0.getMonth() + 1, 1); bouwKal(); });
    kop.append(terug, mnd, verder);

    const maanden = el('div', 'maanden');
    maanden.append(maandBlok(m0, perDag, vandaag), maandBlok(m1, perDag, vandaag));
    kal.append(kop, maanden);
  }

  function bouwTapLijn() {
    tapLijn.textContent = '';
    if (!state.tapDag || !state.data) return;
    const opt = state.data.options.find((o) => o.date === state.tapDag);
    const wanneer = el('span', 'wanneer', fmtDatum(state.tapDag, opt ? opt.time : null));
    tapLijn.append(wanneer, document.createTextNode(': '));
    if (opt) tapLijn.append(namenMetKleur(opt));
    else tapLijn.append(el('span', null, t('poll.nobody')));
  }

  function render() {
    const d = state.data;
    if (!d) return;
    document.title = d.title + ' · ' + BRAND;
    if (!state.titelEdit) titelKop.textContent = d.title;
    titelEditBtn.textContent = t('title.edit');
    titelOk.textContent = t('title.save');
    titelIn.placeholder = t('make.what.ph');
    deelTekst.textContent = t('share.ready') + ' ';
    if (kopieKnop.textContent !== t('share.copied')) {
      kopieKnop.textContent = t('share.copy');
    }
    naamZone.classList.toggle('verborgen', !!state.me);
    naamLabel.textContent = t('make.name');
    naamIn.placeholder = t('make.name.ph');
    verderBtn.textContent = t('poll.next');

    const ik = d.participants.find((p) => p.id === state.me);
    wieBar.classList.toggle('verborgen', !state.me);
    // "{name}" mag vooraan of achteraan staan, afhankelijk van de taal
    const [voor, na] = t('cal.actAs').split('{name}');
    wieTekst.textContent = voor || '';
    wieNaam.textContent = ik ? ik.name : '';
    wieNaam.style.color = ik ? kleurVan(ik.id) : '';
    wieNa.textContent = na || '';
    wieWissel.textContent = t('cal.switch');

    // gekleurde naamchips: altijd zichtbaar zolang er deelnemers zijn.
    // Klik zonder eigen naam = "dat ben ik" (identiteit claimen);
    // klik met eigen naam = tijdelijk namens die persoon aanklikken.
    const heeftNamen = d.participants.length > 0;
    chips.classList.toggle('verborgen', !heeftNamen);
    chipsLabel.classList.toggle('verborgen', !(heeftNamen && !state.me));
    chipsLabel.textContent = t('pick.who');
    chips.textContent = '';
    for (const p of d.participants) {
      const b = el('button', 'chip' + (p.id === state.me ? ' ik' : ''));
      b.type = 'button';
      const stip = el('span', 'stip');
      stip.style.background = kleurVan(p.id);
      b.append(stip, bdi(p.name), el('span', null, p.id === state.own ? ' (' + t('poll.you') + ')' : ''));
      b.addEventListener('click', async () => {
        if (!state.own) {
          // fris toestel: deze naam claimen als de jouwe
          state.own = p.id;
          try {
            localStorage.setItem(LS.p(pollId), p.id);
            localStorage.setItem(LS.name, p.name);
          } catch {}
        }
        zetActing(p.id);
        state.lastJson = '';
        await haalOp(true);
      });
      chips.append(b);
    }
    nieuwRij.classList.toggle('verborgen', !(state.me && state.nieuwOpen));
    nieuwIn.placeholder = t('cal.newName.ph');
    nieuwOk.textContent = t('poll.next');

    deelKnop.textContent = t('share.button');
    // legenda onder de kalender
    legenda.textContent = '';
    const lg1 = el('span'); lg1.append(el('span', 'vk', '✓'), el('span', null, t('legend.you')));
    const lg2 = el('span'); lg2.append(el('span', 'dt'), el('span', null, t('legend.other')));
    legenda.append(lg1, lg2);

    kalHint.textContent = state.me ? t('cal.hint') : t('poll.nameFirst');
    const wegNaam = ik ? ik.name : '';
    wegBtn.textContent = t('poll.leave', { name: wegNaam });
    wegJa.textContent = t('poll.leaveYes', { name: wegNaam });
    wegNee.textContent = t('poll.leaveNo');
    wegZone.classList.toggle('verborgen', !state.me);

    bezoek.textContent = t('visits', { n: d.visits || 0 });
    bezoek.classList.remove('verborgen');

    bouwStatus();
    bouwKal();
    bouwTapLijn();
  }

  function schermOnbekend() {
    scherm.textContent = '';
    const kop = el('h1', null, t('notfound.title'));
    const tekst = el('p', null, t('notfound.text'));
    const knop = el('button', null, t('notfound.new'));
    knop.type = 'button';
    knop.addEventListener('click', () => { location.href = '/'; });
    scherm.append(kop, tekst, knop);
    hertaal = () => {
      kop.textContent = t('notfound.title');
      tekst.textContent = t('notfound.text');
      knop.textContent = t('notfound.new');
    };
  }

  async function haalOp(forceer) {
    let res, tekst;
    try {
      res = await fetch('/api/polls/' + pollId, { cache: 'no-store' });
      tekst = await res.text();
    } catch {
      return;
    }
    if (res.status === 404) {
      schermOnbekend();
      return;
    }
    if (!res.ok) return;
    if (!forceer && state.inflight > 0) return; // race: oudere data negeren
    if (tekst === state.lastJson) return;
    state.lastJson = tekst;
    state.data = JSON.parse(tekst);
    const bestaat = (pid) => state.data.participants.some((p) => p.id === pid);
    if (state.own && !bestaat(state.own)) {
      state.own = null;
      try { localStorage.removeItem(LS.p(pollId)); } catch {}
    }
    if (state.me && !bestaat(state.me)) {
      zetActing(state.own);
    }
    render();
  }

  hertaal = render;

  // Bezoek één keer per browser per afspraak tellen.
  async function telBezoek() {
    try {
      if (localStorage.getItem(LS.visited(pollId))) return;
      localStorage.setItem(LS.visited(pollId), '1');
    } catch {}
    try {
      await api('/polls/' + pollId + '/visit', 'POST', {});
      state.lastJson = '';
      await haalOp(true);
    } catch {}
  }

  haalOp(true).then(telBezoek);
  setInterval(() => haalOp(false), 10000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') haalOp(false);
  });
}

/* ---------- route ---------- */
const pad = location.pathname.replace(/\/+$/, '');
if (pad.startsWith('/p/') && pad.length > 3) {
  schermAfspraak(pad.slice(3));
} else {
  schermMaken();
}

/* ---------- PWA: service worker, installeren, update-check ---------- */
(function pwa() {
  const isLocal = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);

  // service worker enkel in productie (houdt dev en tests schoon)
  if ('serviceWorker' in navigator && !isLocal) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
  }

  // --- update-check: vergelijk de draaiende versie met de server ---
  const updateBar = document.getElementById('updateBar');
  const updateTekst = document.getElementById('updateTekst');
  const updateBtn = document.getElementById('updateBtn');
  function toonUpdate() {
    updateTekst.textContent = t('update.text');
    updateBtn.textContent = t('update.button');
    updateBar.classList.remove('verborgen');
  }
  async function checkUpdate() {
    try {
      const res = await fetch('/api/version', { cache: 'no-store' });
      if (!res.ok) return;
      const d = await res.json();
      if (d && d.version && d.version !== VERSIE) toonUpdate();
    } catch {}
  }
  updateBtn.addEventListener('click', async () => {
    updateBtn.disabled = true;
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r) => r.unregister()));
      }
      if (window.caches) {
        const keys = await caches.keys();
        await Promise.all(keys.map((k) => caches.delete(k)));
      }
    } catch {}
    location.reload();
  });
  checkUpdate();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkUpdate();
  });

  // --- installeren als app: ALLEEN op een smartphone/tablet ---
  const installBar = document.getElementById('installBar');
  const installTekst = document.getElementById('installTekst');
  const installBtn = document.getElementById('installBtn');
  const installSluit = document.getElementById('installSluit');
  const mobiel = /android|iphone|ipad|ipod|mobile|silk|kindle/i.test(navigator.userAgent);
  const staat = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const alGesloten = () => { try { return localStorage.getItem('whenly.install.dismiss') === '1'; } catch { return false; } };
  let deferred = null;
  let verbergTimer = null;

  // toon het popupje: 10 seconden zichtbaar, of weg met de x
  function toonInstall(metKnop) {
    if (!mobiel || staat || alGesloten()) return;
    installTekst.textContent = metKnop ? t('install.text') : t('install.ios');
    installBtn.classList.toggle('verborgen', !metKnop);
    if (metKnop) installBtn.textContent = t('install.button');
    installBar.classList.remove('verborgen');
    clearTimeout(verbergTimer);
    verbergTimer = setTimeout(() => installBar.classList.add('verborgen'), 10000);
  }
  function verbergInstall(onthoud) {
    clearTimeout(verbergTimer);
    installBar.classList.add('verborgen');
    if (onthoud) { try { localStorage.setItem('whenly.install.dismiss', '1'); } catch {} }
  }
  installSluit.addEventListener('click', () => verbergInstall(true)); // x = niet meer tonen
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferred = e;
    toonInstall(true);
  });
  installBtn.addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt();                 // meteen het installeer-venster van het toestel
    try { await deferred.userChoice; } catch {}
    deferred = null;
    verbergInstall(false);
  });
  // iOS Safari kent geen beforeinstallprompt -> korte hint tonen (zelfde 10s + x)
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isSafari = /^((?!chrome|crios|fxios|android).)*safari/i.test(navigator.userAgent);
  if (isIOS && isSafari) toonInstall(false);
})();
</script>
