<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prikdatum</title>
<style>
  :root {
    --tekst: #1F2933;
    --gedempt: #6B7580;
    --lijn: #E3E7EB;
    --groen: #2F8F5B;
    --lichtgroen: #E8F5EE;
    --rood: #B23A3A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #FFFFFF;
    color: var(--tekst);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
  }
  .col {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }
  h1 {
    font-size: 26px;
    font-weight: 600;
    margin: 16px 0 2px;
    overflow-wrap: anywhere;
  }
  .label {
    font-size: 14px;
    color: var(--gedempt);
    display: block;
    margin: 20px 0 6px;
  }
  input[type="text"], input[type="time"] {
    font: inherit;
    color: inherit;
    border: 1px solid var(--lijn);
    border-radius: 8px;
    padding: 12px;
    min-height: 44px;
    background: #fff;
    width: 100%;
  }
  input:focus {
    outline: none;
    border-color: var(--groen);
    box-shadow: 0 0 0 1px var(--groen);
  }
  button {
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    min-height: 44px;
    cursor: pointer;
    background: var(--groen);
    color: #fff;
  }
  button:disabled {
    background: var(--lijn);
    color: var(--gedempt);
    cursor: default;
  }
  button.sec {
    background: none;
    color: var(--groen);
    padding: 12px 8px;
  }
  button.klein {
    padding: 8px 14px;
    min-height: 44px;
    font-size: 15px;
  }
  .fout {
    color: var(--rood);
    font-size: 15px;
    margin: 10px 0 0;
  }
  .fade { animation: fade .15s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* vlaggetje */
  .kop { display: flex; align-items: flex-start; position: relative; min-height: 44px; }
  #vlag {
    background: none;
    padding: 0;
    width: 44px;
    height: 44px;
    min-height: 44px;
    font-size: 24px;
    line-height: 44px;
    text-align: left;
  }
  #talen {
    position: absolute;
    top: 46px;
    left: 0;
    background: #fff;
    border: 1px solid var(--lijn);
    border-radius: 8px;
    padding: 4px;
    z-index: 5;
  }
  #talen button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    color: var(--tekst);
    font-weight: 400;
    padding: 10px 14px;
    white-space: nowrap;
  }

  /* deelbalk */
  .deel {
    background: var(--lichtgroen);
    border-radius: 8px;
    padding: 12px;
    margin: 16px 0 0;
    font-size: 15px;
  }
  .deel .url { user-select: all; word-break: break-all; display: block; margin: 4px 0 8px; }

  /* titel aanpassen */
  .titelrij button.sec { font-size: 13px; color: var(--gedempt); padding: 4px 0; min-height: 44px; text-decoration: underline; font-weight: 400; }
  .titeleditor { display: flex; gap: 8px; margin: 12px 0 4px; }

  /* statusblok */
  .status { margin: 12px 0 4px; }
  .status .balk {
    background: var(--lichtgroen);
    border-radius: 8px;
    padding: 14px;
  }
  .status .balk.definitief { border-left: 3px solid var(--groen); }
  .status .groot { font-size: 20px; font-weight: 600; color: var(--groen); }
  .status .sub { font-size: 14px; color: var(--gedempt); margin-top: 2px; }
  .status .stil { color: var(--gedempt); }
  .status .rijtje { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .status .knopzone { margin-top: 8px; }

  /* wie ben je / wisselen */
  .wie { font-size: 15px; margin: 16px 0 0; }
  .wie b { font-weight: 600; }
  .wie button.sec { padding: 4px 6px; min-height: 44px; font-size: 14px; }
  .wissel { border: 1px solid var(--lijn); border-radius: 8px; padding: 10px; margin-top: 8px; }
  .wissel .namen { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .wissel .namen button {
    background: none;
    border: 1px solid var(--lijn);
    color: var(--tekst);
    font-weight: 400;
    padding: 8px 14px;
    min-height: 44px;
  }
  .wissel .namen button.ik { border-color: var(--groen); background: var(--lichtgroen); font-weight: 600; }
  .wissel .nieuw { display: flex; gap: 8px; }

  /* kalender */
  .kal { margin: 6px 0 4px; }
  .kal.inactief .dag { opacity: .5; }
  .kalkop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .kalkop .mnd { font-weight: 600; }
  .kalkop button { background: none; color: var(--groen); font-size: 22px; padding: 4px 16px; }
  .kalgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .kalwd { font-size: 12px; color: var(--gedempt); text-align: center; padding: 2px 0; }
  .dag {
    min-height: 48px;
    border: 1px solid var(--lijn);
    border-radius: 8px;
    background: #fff;
    color: var(--tekst);
    font-weight: 400;
    padding: 4px 0 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 0;
    line-height: 1.2;
  }
  .dag.leeg { border: none; background: none; cursor: default; }
  .dag.vandaag { border-color: var(--gedempt); }
  .dag.optie { border-color: var(--groen); }
  .dag.mijn { background: var(--lichtgroen); border-color: var(--groen); font-weight: 600; }
  .dag.definitief { box-shadow: inset 3px 0 0 var(--groen); }
  .dag .dtel { font-size: 11px; color: var(--groen); font-weight: 600; min-height: 14px; }

  /* gekozen dagen */
  .kopje { font-size: 14px; color: var(--gedempt); margin: 20px 0 6px; }
  .opt {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 48px;
    padding: 6px;
    border-radius: 8px;
  }
  .opt.aan { background: var(--lichtgroen); }
  .opt.definitief { border-left: 3px solid var(--groen); }
  .opt .mid { flex: 1 1 auto; min-width: 0; }
  .opt .namen { font-size: 14px; color: var(--gedempt); }
  .opt .tel { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .opt .tel.nul { color: var(--gedempt); font-weight: 400; }
  .opt input[type="time"] { width: 96px; flex: 0 0 96px; padding: 8px; min-height: 44px; font-size: 15px; }
  .leeg { color: var(--gedempt); margin: 10px 0; font-size: 15px; }

  /* weggaan */
  .weg { margin-top: 40px; font-size: 13px; }
  .weg button {
    background: none;
    color: var(--gedempt);
    font-size: 13px;
    font-weight: 400;
    padding: 8px 0;
    text-decoration: underline;
  }
  .weg .bevestig button { margin-right: 8px; text-decoration: none; }
  .weg .bevestig button.ja { color: var(--rood); }

  .voet {
    margin-top: 48px;
    font-size: 13px;
    color: var(--gedempt);
  }
  .verborgen { display: none !important; }
</style>
</head>
<body>
<div class="col">
  <div class="kop">
    <button id="vlag" type="button"></button>
    <div id="talen" class="verborgen"></div>
  </div>
  <div id="scherm"></div>
  <p class="voet" id="voet"></p>
</div>
<script>
'use strict';

/* ---------- vertalingen: alle tekst staat hier en nergens anders ---------- */
const STRINGS = {
  'make.title':        { nl: 'Wanneer spreken we af?', en: 'When shall we meet?', fr: 'Quand se voit-on ?' },
  'make.what':         { nl: 'Waarover gaat het?', en: 'What is it about?', fr: "De quoi s'agit-il ?" },
  'make.what.ph':      { nl: 'bv. Etentje, padel, weekend aan zee', en: 'e.g. Dinner, padel, weekend at the coast', fr: 'p.ex. Dîner, padel, week-end à la mer' },
  'make.name':         { nl: 'Je naam', en: 'Your name', fr: 'Ton prénom' },
  'make.name.ph':      { nl: 'bv. Ali', en: 'e.g. Ali', fr: 'p.ex. Ali' },
  'make.submit':       { nl: 'Maak de afspraak', en: 'Create the poll', fr: 'Créer le rendez-vous' },
  'share.ready':       { nl: 'Klaar. Deel deze link:', en: 'Done. Share this link:', fr: "C'est prêt. Partage ce lien :" },
  'share.copy':        { nl: 'Kopieer', en: 'Copy', fr: 'Copier' },
  'share.copied':      { nl: 'Gekopieerd', en: 'Copied', fr: 'Copié' },
  'title.edit':        { nl: 'titel aanpassen', en: 'edit title', fr: 'modifier le titre' },
  'title.save':        { nl: 'Bewaar', en: 'Save', fr: 'Enregistrer' },
  'poll.nameFirst':    { nl: 'Vul eerst je naam in om aan te klikken.', en: 'Enter your name first to start ticking.', fr: "Indique d'abord ton prénom pour cocher." },
  'poll.next':         { nl: 'Verder', en: 'Continue', fr: 'Continuer' },
  'cal.hint':          { nl: 'Klik de dagen aan die voor jou lukken', en: 'Click the days that work for you', fr: 'Clique sur les jours qui te conviennent' },
  'cal.prev':          { nl: 'Vorige maand', en: 'Previous month', fr: 'Mois précédent' },
  'cal.next':          { nl: 'Volgende maand', en: 'Next month', fr: 'Mois suivant' },
  'cal.actAs':         { nl: 'Jij klikt aan als', en: 'You are ticking as', fr: 'Tu coches en tant que' },
  'cal.switch':        { nl: 'wisselen', en: 'switch', fr: 'changer' },
  'cal.newName.ph':    { nl: 'of typ een nieuwe naam', en: 'or type a new name', fr: 'ou tape un nouveau prénom' },
  'list.title':        { nl: 'Gekozen dagen', en: 'Chosen days', fr: 'Jours choisis' },
  'list.empty':        { nl: 'Nog geen dagen aangeklikt.', en: 'No days ticked yet.', fr: 'Aucun jour coché pour l’instant.' },
  'time.label':        { nl: 'Uur (optioneel, iedereen mag dit aanpassen)', en: 'Time (optional, anyone can change it)', fr: "Heure (optionnelle, modifiable par tous)" },
  'poll.nobody':       { nl: 'nog niemand', en: 'nobody yet', fr: "personne pour l'instant" },
  'poll.you':          { nl: 'jij', en: 'you', fr: 'toi' },
  'poll.others':       { nl: '+{n} anderen', en: '+{n} others', fr: '+{n} autres' },
  'poll.at':           { nl: 'om {time}', en: 'at {time}', fr: 'à {time}' },
  'poll.leave':        { nl: 'Ik doe niet mee', en: 'Remove me', fr: 'Je ne participe pas' },
  'poll.leaveYes':     { nl: 'Ja, haal me weg', en: 'Yes, remove me', fr: 'Oui, retire-moi' },
  'poll.leaveNo':      { nl: 'Toch niet', en: 'Never mind', fr: 'Finalement non' },
  'status.none':       { nl: 'Nog niemand heeft geantwoord.', en: 'Nobody has answered yet.', fr: "Personne n'a encore répondu." },
  'status.one':        { nl: 'We hebben een datum: {date}', en: 'We have a date: {date}', fr: 'On a une date : {date}' },
  'status.everyone':   { nl: 'Iedereen kan op {date}', en: 'Everyone can make {date}', fr: 'Tout le monde peut le {date}' },
  'status.count':      { nl: '{n} van {total} kunnen', en: '{n} of {total} can make it', fr: '{n} sur {total} peuvent' },
  'status.tie':        { nl: 'Meerdere datums lukken', en: 'Several dates work', fr: 'Plusieurs dates conviennent' },
  'status.tieCount':   { nl: '{n} van {total} kunnen op elk van deze:', en: '{n} of {total} can make each of these:', fr: '{n} sur {total} peuvent à chacune de ces dates :' },
  'status.pick':       { nl: 'Deze nemen', en: 'Pick this one', fr: 'Choisir celle-ci' },
  'status.fix':        { nl: 'Vastleggen', en: 'Lock it in', fr: 'Confirmer' },
  'status.final':      { nl: 'Afgesproken: {date}', en: 'Agreed: {date}', fr: "C'est fixé : {date}" },
  'status.unfix':      { nl: 'Toch niet', en: 'Undo', fr: 'Annuler' },
  'err.save':          { nl: 'Kon niet opslaan. Probeer opnieuw.', en: "Couldn't save. Try again.", fr: "Impossible d'enregistrer. Réessaie." },
  'err.duplicate_option': { nl: 'Die datum staat er al.', en: 'That date is already listed.', fr: 'Cette date existe déjà.' },
  'err.option_in_use': { nl: 'Iemand anders heeft deze datum aangeklikt.', en: 'Someone else ticked this date.', fr: "Quelqu'un d'autre a coché cette date." },
  'err.title_required': { nl: 'Vul in waarover het gaat.', en: "Say what it's about.", fr: "Indique de quoi il s'agit." },
  'err.name_required': { nl: 'Vul je naam in.', en: 'Enter your name.', fr: 'Indique ton prénom.' },
  'err.invalid_date':  { nl: 'Kies minstens één datum.', en: 'Pick at least one date.', fr: 'Choisis au moins une date.' },
  'err.generic':       { nl: 'Er ging iets mis. Probeer opnieuw.', en: 'Something went wrong. Try again.', fr: 'Quelque chose a raté. Réessaie.' },
  'notfound.title':    { nl: 'Deze afspraak bestaat niet', en: "This poll doesn't exist", fr: "Ce rendez-vous n'existe pas" },
  'notfound.text':     { nl: 'Controleer de link, of maak een nieuwe.', en: 'Check the link, or create a new one.', fr: 'Vérifie le lien, ou crées-en un nouveau.' },
  'notfound.new':      { nl: 'Nieuwe afspraak', en: 'New poll', fr: 'Nouveau rendez-vous' },
  'footer':            { nl: 'Prikdatum · gratis, zonder account', en: 'Prikdatum · free, no account', fr: 'Prikdatum · gratuit, sans compte' },
  'lang.nl':           { nl: 'Nederlands', en: 'Nederlands', fr: 'Nederlands' },
  'lang.en':           { nl: 'English', en: 'English', fr: 'English' },
  'lang.fr':           { nl: 'Français', en: 'Français', fr: 'Français' },
};
const BRAND = 'Prikdatum';
const LOCALES = { nl: 'nl-BE', en: 'en-GB', fr: 'fr-BE' };
const FLAGS = { nl: '\u{1F1E7}\u{1F1EA}', en: '\u{1F1EC}\u{1F1E7}', fr: '\u{1F1EB}\u{1F1F7}' };
const LS = { name: 'prikdatum.name', lang: 'prikdatum.lang', p: (id) => 'prikdatum.p.' + id, just: 'prikdatum.justCreated' };

function bepaalTaal() {
  try {
    const opgeslagen = localStorage.getItem(LS.lang);
    if (opgeslagen && STRINGS['lang.' + opgeslagen]) return opgeslagen;
  } catch {}
  const nav = (navigator.language || '').toLowerCase();
  if (nav.startsWith('fr')) return 'fr';
  if (nav.startsWith('en')) return 'en';
  return 'nl';
}

const state = {
  lang: bepaalTaal(),
  pollId: null,
  data: null,
  lastJson: '',
  me: null,
  inflight: 0,
  kalMaand: null,      // Date: eerste dag van de getoonde maand
  titelEdit: false,
  wisselOpen: false,
};

function t(sleutel, vars) {
  let s = (STRINGS[sleutel] || {})[state.lang] || '';
  if (vars) for (const k of Object.keys(vars)) s = s.replaceAll('{' + k + '}', String(vars[k]));
  return s;
}

function fmtDatum(datum, tijd) {
  const d = new Date(datum + 'T12:00:00');
  const opties = { weekday: 'short', day: 'numeric', month: 'short' };
  if (d.getFullYear() !== new Date().getFullYear()) opties.year = 'numeric';
  let s = new Intl.DateTimeFormat(LOCALES[state.lang], opties).format(d);
  if (tijd) s += ' ' + t('poll.at', { time: tijd });
  return s;
}

function isoDag(d) {
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dag = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + dag;
}

function el(tag, cls, tekst) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (tekst !== undefined) n.textContent = tekst;
  return n;
}

async function api(pad, methode, body) {
  const res = await fetch('/api' + pad, {
    method: methode || 'GET',
    headers: body !== undefined ? { 'Content-Type': 'application/json' } : undefined,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch {}
  return { ok: res.ok, status: res.status, data };
}

function foutTekst(data) {
  const code = data && data.error;
  return STRINGS['err.' + code] ? t('err.' + code) : t('err.generic');
}

/* ---------- vlaggetje ---------- */
const vlagBtn = document.getElementById('vlag');
const talenMenu = document.getElementById('talen');
let hertaal = () => {};

function bouwTalen() {
  talenMenu.textContent = '';
  for (const l of ['nl', 'en', 'fr']) {
    const b = el('button', null, FLAGS[l] + ' ' + t('lang.' + l));
    b.type = 'button';
    b.addEventListener('click', () => {
      state.lang = l;
      try { localStorage.setItem(LS.lang, l); } catch {}
      talenMenu.classList.add('verborgen');
      document.documentElement.lang = l;
      vlagBtn.textContent = FLAGS[state.lang];
      bouwTalen();
      document.getElementById('voet').textContent = t('footer');
      hertaal();
    });
    talenMenu.appendChild(b);
  }
}
vlagBtn.addEventListener('click', () => talenMenu.classList.toggle('verborgen'));
vlagBtn.textContent = FLAGS[state.lang];
document.documentElement.lang = state.lang;
bouwTalen();
document.getElementById('voet').textContent = t('footer');

const scherm = document.getElementById('scherm');

/* ================================================================
   Scherm 1: Nieuwe afspraak (/) — titel + naam, daarna meteen door
   ================================================================ */
function schermMaken() {
  scherm.textContent = '';

  const titelKop = el('h1');
  const watLabel = el('label', 'label');
  watLabel.htmlFor = 'titel';
  const titelIn = el('input');
  titelIn.type = 'text'; titelIn.id = 'titel'; titelIn.maxLength = 80; titelIn.autofocus = true;

  const naamLabel = el('label', 'label');
  naamLabel.htmlFor = 'naam';
  const naamIn = el('input');
  naamIn.type = 'text'; naamIn.id = 'naam'; naamIn.maxLength = 40;
  try { naamIn.value = localStorage.getItem(LS.name) || ''; } catch {}

  const maakBtn = el('button');
  maakBtn.type = 'button';
  maakBtn.style.marginTop = '20px';
  const foutRegel = el('p', 'fout verborgen');

  function checkKnop() {
    maakBtn.disabled = !(titelIn.value.trim() && naamIn.value.trim());
  }
  titelIn.addEventListener('input', checkKnop);
  naamIn.addEventListener('input', checkKnop);
  naamIn.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !maakBtn.disabled) maakBtn.click(); });

  maakBtn.addEventListener('click', async () => {
    foutRegel.classList.add('verborgen');
    maakBtn.disabled = true;
    const r = await api('/polls', 'POST', { title: titelIn.value, name: naamIn.value });
    if (r.ok && r.data && r.data.id) {
      try {
        localStorage.setItem(LS.name, naamIn.value.trim());
        localStorage.setItem(LS.p(r.data.id), r.data.participantId);
        sessionStorage.setItem(LS.just, r.data.id);
      } catch {}
      location.href = '/p/' + r.data.id;
      return;
    }
    foutRegel.textContent = foutTekst(r.data);
    foutRegel.classList.remove('verborgen');
    checkKnop();
  });

  hertaal = () => {
    document.title = t('make.title');
    titelKop.textContent = t('make.title');
    watLabel.textContent = t('make.what');
    titelIn.placeholder = t('make.what.ph');
    naamLabel.textContent = t('make.name');
    naamIn.placeholder = t('make.name.ph');
    maakBtn.textContent = t('make.submit');
  };

  scherm.append(titelKop, watLabel, titelIn, naamLabel, naamIn, el('div'), maakBtn, foutRegel);
  hertaal();
  checkKnop();
  titelIn.focus();
}

/* ================================================================
   Scherm 2: Afspraak (/p/<id>) — naam eerst, dan de klikkalender
   ================================================================ */
function schermAfspraak(pollId) {
  state.pollId = pollId;
  try { state.me = localStorage.getItem(LS.p(pollId)); } catch {}

  scherm.textContent = '';

  /* --- vaste elementen die nooit mee her-renderen --- */
  const deel = el('div', 'deel verborgen');
  const deelTekst = el('span');
  const deelUrl = el('span', 'url', location.origin + '/p/' + pollId);
  const kopieKnop = el('button', 'klein'); kopieKnop.type = 'button';
  deel.append(deelTekst, deelUrl, kopieKnop);

  const titelRij = el('div', 'titelrij');
  const titelKop = el('h1');
  const titelEditBtn = el('button', 'sec'); titelEditBtn.type = 'button';
  const titelEditor = el('div', 'titeleditor verborgen');
  const titelIn = el('input'); titelIn.type = 'text'; titelIn.maxLength = 80;
  const titelOk = el('button', 'klein'); titelOk.type = 'button';
  titelEditor.append(titelIn, titelOk);
  titelRij.append(titelKop, titelEditBtn, titelEditor);

  const statusBlok = el('div', 'status');

  const naamZone = el('div');
  const naamLabel = el('label', 'label');
  naamLabel.htmlFor = 'joinnaam';
  const naamIn = el('input');
  naamIn.type = 'text'; naamIn.id = 'joinnaam'; naamIn.maxLength = 40;
  try { naamIn.value = localStorage.getItem(LS.name) || ''; } catch {}
  const verderBtn = el('button'); verderBtn.type = 'button';
  const naamFout = el('p', 'fout verborgen');
  const naamKnopRij = el('div'); naamKnopRij.style.marginTop = '10px';
  naamKnopRij.append(verderBtn);
  naamZone.append(naamLabel, naamIn, naamKnopRij, naamFout);

  const wieBar = el('p', 'wie verborgen');
  const wieTekst = el('span');
  const wieNaam = el('b');
  const wieWissel = el('button', 'sec'); wieWissel.type = 'button';
  wieBar.append(wieTekst, wieNaam, document.createTextNode(' · '), wieWissel);
  const wissel = el('div', 'wissel verborgen');
  const wisselNamen = el('div', 'namen');
  const wisselNieuw = el('div', 'nieuw');
  const wisselIn = el('input'); wisselIn.type = 'text'; wisselIn.maxLength = 40;
  const wisselOk = el('button', 'klein'); wisselOk.type = 'button';
  wisselNieuw.append(wisselIn, wisselOk);
  wissel.append(wisselNamen, wisselNieuw);

  const kalHint = el('p', 'kopje');
  const kal = el('div', 'kal');
  const lijstFout = el('p', 'fout verborgen');

  const lijstKop = el('p', 'kopje');
  const lijst = el('div', 'lijst');
  const leegRegel = el('p', 'leeg verborgen');

  const wegZone = el('div', 'weg');
  const wegBtn = el('button'); wegBtn.type = 'button';
  const wegBevestig = el('span', 'bevestig verborgen');
  const wegJa = el('button', 'ja'); wegJa.type = 'button';
  const wegNee = el('button'); wegNee.type = 'button';
  wegBevestig.append(wegJa, wegNee);
  wegZone.append(wegBtn, wegBevestig);

  scherm.append(deel, titelRij, statusBlok, naamZone, wieBar, wissel, kalHint, kal, lijstFout, lijstKop, leegRegel, lijst, wegZone);

  const nu = new Date();
  state.kalMaand = new Date(nu.getFullYear(), nu.getMonth(), 1);

  /* --- deelbalk --- */
  try {
    if (sessionStorage.getItem(LS.just) === pollId) {
      sessionStorage.removeItem(LS.just);
      deel.classList.remove('verborgen');
    }
  } catch {}
  let kopieTimer = null;
  kopieKnop.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(deelUrl.textContent);
      kopieKnop.textContent = t('share.copied');
      clearTimeout(kopieTimer);
      kopieTimer = setTimeout(() => { kopieKnop.textContent = t('share.copy'); }, 2000);
    } catch {
      const sel = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(deelUrl);
      sel.removeAllRanges();
      sel.addRange(range);
    }
  });

  /* --- titel aanpassen (iedereen mag) --- */
  titelEditBtn.addEventListener('click', () => {
    state.titelEdit = true;
    titelIn.value = state.data ? state.data.title : '';
    titelKop.classList.add('verborgen');
    titelEditBtn.classList.add('verborgen');
    titelEditor.classList.remove('verborgen');
    titelIn.focus();
  });
  async function bewaarTitel() {
    const r = await api('/polls/' + pollId + '/title', 'PUT', { title: titelIn.value });
    state.titelEdit = false;
    titelEditor.classList.add('verborgen');
    titelKop.classList.remove('verborgen');
    titelEditBtn.classList.remove('verborgen');
    if (r.ok) { state.lastJson = ''; await haalOp(true); }
  }
  titelOk.addEventListener('click', bewaarTitel);
  titelIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') bewaarTitel(); });

  /* --- naam opgeven / wisselen --- */
  async function wordIemand(naam) {
    const r = await api('/polls/' + pollId + '/participants', 'POST', { name: naam });
    if (r.ok && r.data && r.data.participantId) {
      state.me = r.data.participantId;
      try {
        localStorage.setItem(LS.p(pollId), state.me);
        localStorage.setItem(LS.name, r.data.name);
      } catch {}
      state.wisselOpen = false;
      state.lastJson = '';
      await haalOp(true);
      return true;
    }
    return r;
  }
  verderBtn.addEventListener('click', async () => {
    naamFout.classList.add('verborgen');
    const r = await wordIemand(naamIn.value);
    if (r !== true) {
      naamFout.textContent = foutTekst(r && r.data);
      naamFout.classList.remove('verborgen');
    }
  });
  naamIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') verderBtn.click(); });

  wieWissel.addEventListener('click', () => {
    state.wisselOpen = !state.wisselOpen;
    render();
    if (state.wisselOpen) wisselIn.focus();
  });
  wisselOk.addEventListener('click', async () => {
    if (!wisselIn.value.trim()) { wisselIn.focus(); return; }
    const r = await wordIemand(wisselIn.value);
    if (r === true) wisselIn.value = '';
  });
  wisselIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') wisselOk.click(); });

  /* --- mezelf weghalen --- */
  wegBtn.addEventListener('click', () => {
    wegBtn.classList.add('verborgen');
    wegBevestig.classList.remove('verborgen');
  });
  wegNee.addEventListener('click', () => {
    wegBevestig.classList.add('verborgen');
    wegBtn.classList.remove('verborgen');
  });
  wegJa.addEventListener('click', async () => {
    const r = await api('/polls/' + pollId + '/participants/' + state.me, 'DELETE');
    wegBevestig.classList.add('verborgen');
    wegBtn.classList.remove('verborgen');
    if (r.ok) {
      state.me = null;
      try { localStorage.removeItem(LS.p(pollId)); } catch {}
      state.lastJson = '';
      await haalOp(true);
    }
  });

  /* --- kalenderklik: dag aan/uit --- */
  async function klikDag(datum) {
    if (!state.me) { naamIn.focus(); return; }
    lijstFout.classList.add('verborgen');
    const d = state.data;
    const opt = d.options.find((o) => o.date === datum);
    const vorige = structuredClone(d);
    state.inflight++;
    try {
      if (!opt) {
        // nieuwe dag: meteen optimistisch tonen
        d.options.push({ id: '_tmp', date: datum, time: null, addedBy: state.me, votes: [state.me] });
        d.options.sort((a, b) => a.date < b.date ? -1 : 1);
        render();
        const r = await api('/polls/' + pollId + '/options', 'POST', {
          participantId: state.me, date: datum, time: null,
        });
        if (!r.ok && (!r.data || r.data.error !== 'duplicate_option')) throw r;
      } else if (opt.votes.includes(state.me)) {
        if (opt.votes.length === 1) {
          // enkel mijn vinkje: dag verdwijnt
          d.options = d.options.filter((o) => o.id !== opt.id);
          if (d.finalOptionId === opt.id) d.finalOptionId = null;
          render();
          const r = await api('/polls/' + pollId + '/options/' + opt.id + '?participantId=' + encodeURIComponent(state.me), 'DELETE');
          if (!r.ok) throw r;
        } else {
          opt.votes = opt.votes.filter((v) => v !== state.me);
          render();
          const set = d.options.filter((o) => o.votes.includes(state.me)).map((o) => o.id);
          const r = await api('/polls/' + pollId + '/participants/' + state.me + '/votes', 'PUT', { optionIds: set });
          if (!r.ok) throw r;
        }
      } else {
        opt.votes.push(state.me);
        render();
        const set = d.options.filter((o) => o.votes.includes(state.me)).map((o) => o.id);
        const r = await api('/polls/' + pollId + '/participants/' + state.me + '/votes', 'PUT', { optionIds: set });
        if (!r.ok) throw r;
      }
      state.lastJson = '';
    } catch (r) {
      state.data = vorige;
      state.lastJson = '';
      render();
      lijstFout.textContent = foutTekst(r && r.data);
      lijstFout.classList.remove('verborgen');
    } finally {
      state.inflight--;
    }
    await haalOp(true);
  }

  async function zetTijd(opt, tijd) {
    state.inflight++;
    try {
      const r = await api('/polls/' + pollId + '/options/' + opt.id + '/time', 'PUT', { time: tijd || null });
      if (!r.ok) throw r;
      opt.time = tijd || null;
      state.lastJson = '';
    } catch {
      lijstFout.textContent = t('err.save');
      lijstFout.classList.remove('verborgen');
    } finally {
      state.inflight--;
    }
    await haalOp(true);
  }

  async function zetFinal(optionId) {
    state.inflight++;
    try {
      await api('/polls/' + pollId + '/final', 'PUT', { optionId });
      state.lastJson = '';
    } finally {
      state.inflight--;
    }
    await haalOp(true);
  }

  /* --- statusblok --- */
  function bouwStatus() {
    statusBlok.textContent = '';
    const d = state.data;
    const n = d.participants.length;
    const perId = new Map(d.options.map((o) => [o.id, o]));
    const blok = el('div', 'fade');

    const definitief = d.finalOptionId && perId.get(d.finalOptionId);
    if (definitief) {
      const balk = el('div', 'balk definitief');
      balk.append(el('div', 'groot', t('status.final', { date: fmtDatum(definitief.date, definitief.time) })));
      balk.append(el('div', 'sub', t('status.count', { n: definitief.votes.length, total: n })));
      const zone = el('div', 'knopzone');
      const los = el('button', 'sec klein', t('status.unfix')); los.type = 'button';
      los.addEventListener('click', () => zetFinal(null));
      zone.append(los);
      balk.append(zone);
      blok.append(balk);
    } else {
      const max = d.options.reduce((m, o) => Math.max(m, o.votes.length), 0);
      if (n === 0 || max === 0) {
        blok.append(el('p', 'stil', t('status.none')));
      } else {
        const top = d.options.filter((o) => o.votes.length === max);
        const balk = el('div', 'balk');
        if (top.length === 1) {
          const o = top[0];
          const iedereen = max === n && n >= 2;
          balk.append(el('div', 'groot', t(iedereen ? 'status.everyone' : 'status.one', { date: fmtDatum(o.date, o.time) })));
          balk.append(el('div', 'sub', t('status.count', { n: max, total: n })));
          const zone = el('div', 'knopzone');
          const vast = el('button', 'sec klein', t('status.fix')); vast.type = 'button';
          vast.addEventListener('click', () => zetFinal(o.id));
          zone.append(vast);
          balk.append(zone);
        } else {
          balk.append(el('div', 'groot', t('status.tie')));
          balk.append(el('div', 'sub', t('status.tieCount', { n: max, total: n })));
          for (const o of top) {
            const rij = el('div', 'rijtje');
            rij.append(el('span', null, fmtDatum(o.date, o.time)));
            const neem = el('button', 'sec klein', t('status.pick')); neem.type = 'button';
            neem.addEventListener('click', () => zetFinal(o.id));
            rij.append(neem);
            balk.append(rij);
          }
        }
        blok.append(balk);
      }
    }
    statusBlok.append(blok);
  }

  /* --- kalender --- */
  function bouwKal() {
    kal.textContent = '';
    kal.classList.toggle('inactief', !state.me);
    const d = state.data;
    const perDag = new Map(d.options.map((o) => [o.date, o]));
    const m = state.kalMaand;
    const locale = LOCALES[state.lang];

    const kop = el('div', 'kalkop');
    const terug = el('button', null, '‹'); terug.type = 'button';
    terug.setAttribute('aria-label', t('cal.prev'));
    const mnd = el('span', 'mnd', new Intl.DateTimeFormat(locale, { month: 'long', year: 'numeric' }).format(m));
    mnd.id = 'kalmaand';
    mnd.dataset.maand = m.getFullYear() + '-' + String(m.getMonth() + 1).padStart(2, '0');
    const verder = el('button', null, '›'); verder.type = 'button';
    verder.setAttribute('aria-label', t('cal.next'));
    terug.addEventListener('click', () => { state.kalMaand = new Date(m.getFullYear(), m.getMonth() - 1, 1); bouwKal(); });
    verder.addEventListener('click', () => { state.kalMaand = new Date(m.getFullYear(), m.getMonth() + 1, 1); bouwKal(); });
    kop.append(terug, mnd, verder);
    kal.append(kop);

    const grid = el('div', 'kalgrid');
    // weekdagkoppen, maandag eerst
    const maandag = new Date(2024, 0, 1); // een maandag
    for (let i = 0; i < 7; i++) {
      const wd = new Date(maandag); wd.setDate(maandag.getDate() + i);
      grid.append(el('div', 'kalwd', new Intl.DateTimeFormat(locale, { weekday: 'short' }).format(wd)));
    }
    const eerste = new Date(m.getFullYear(), m.getMonth(), 1);
    const start = (eerste.getDay() + 6) % 7; // ma=0
    const dagen = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    const vandaag = isoDag(new Date());
    for (let i = 0; i < start; i++) grid.append(el('div', 'dag leeg'));
    for (let dag = 1; dag <= dagen; dag++) {
      const datum = m.getFullYear() + '-' + String(m.getMonth() + 1).padStart(2, '0') + '-' + String(dag).padStart(2, '0');
      const opt = perDag.get(datum);
      const mijn = !!(opt && state.me && opt.votes.includes(state.me));
      const b = el('button', 'dag'); b.type = 'button';
      if (datum === vandaag) b.classList.add('vandaag');
      if (opt) b.classList.add('optie');
      if (mijn) b.classList.add('mijn');
      if (opt && d.finalOptionId === opt.id) b.classList.add('definitief');
      b.dataset.date = datum;
      b.append(el('span', null, String(dag)));
      b.append(el('span', 'dtel', opt && opt.votes.length ? String(opt.votes.length) : ' '));
      b.addEventListener('click', () => klikDag(datum));
      grid.append(b);
    }
    kal.append(grid);
  }

  /* --- gekozen dagen --- */
  function namenRegel(o) {
    const naamVan = new Map(state.data.participants.map((p) => [p.id, p.name]));
    const ikKan = state.me && o.votes.includes(state.me);
    const namen = [];
    if (ikKan) namen.push(t('poll.you'));
    for (const p of state.data.participants) {
      if (p.id === state.me) continue;
      if (o.votes.includes(p.id)) namen.push(naamVan.get(p.id));
    }
    if (!namen.length) return t('poll.nobody');
    if (namen.length > 6) {
      return namen.slice(0, 5).join(', ') + ' ' + t('poll.others', { n: namen.length - 5 });
    }
    return namen.join(', ');
  }

  function bouwLijst() {
    const actief = document.activeElement;
    const focusOid = actief && actief.dataset ? actief.dataset.oid : null;
    lijst.textContent = '';
    const d = state.data;

    if (!d.options.length) {
      leegRegel.textContent = t('list.empty');
      leegRegel.classList.remove('verborgen');
      return;
    }
    leegRegel.classList.add('verborgen');

    for (const o of d.options) {
      if (o.id === '_tmp') continue;
      const ikKan = !!(state.me && o.votes.includes(state.me));
      const rij = el('div', 'opt' + (ikKan ? ' aan' : '') + (d.finalOptionId === o.id ? ' definitief' : ''));

      const mid = el('div', 'mid');
      mid.append(el('div', null, fmtDatum(o.date, null)));
      mid.append(el('div', 'namen', namenRegel(o)));

      const tijd = el('input');
      tijd.type = 'time';
      tijd.value = o.time || '';
      tijd.dataset.oid = o.id;
      tijd.title = t('time.label');
      tijd.setAttribute('aria-label', t('time.label'));
      tijd.addEventListener('change', () => zetTijd(o, tijd.value));

      const tel = el('span', 'tel' + (o.votes.length === 0 ? ' nul' : ''), String(o.votes.length));

      rij.append(mid, tijd, tel);
      lijst.appendChild(rij);
    }

    if (focusOid) {
      const terug = lijst.querySelector('input[data-oid="' + focusOid + '"]');
      if (terug) terug.focus({ preventScroll: true });
    }
  }

  function render() {
    const d = state.data;
    if (!d) return;
    document.title = d.title + ' · ' + BRAND;
    if (!state.titelEdit) titelKop.textContent = d.title;
    titelEditBtn.textContent = t('title.edit');
    titelOk.textContent = t('title.save');
    titelIn.placeholder = t('make.what.ph');
    deelTekst.textContent = t('share.ready') + ' ';
    if (kopieKnop.textContent !== t('share.copied')) {
      kopieKnop.textContent = t('share.copy');
    }
    naamZone.classList.toggle('verborgen', !!state.me);
    naamLabel.textContent = t('make.name');
    naamIn.placeholder = t('make.name.ph');
    verderBtn.textContent = t('poll.next');

    const ik = d.participants.find((p) => p.id === state.me);
    wieBar.classList.toggle('verborgen', !state.me);
    wieTekst.textContent = t('cal.actAs') + ' ';
    wieNaam.textContent = ik ? ik.name : '';
    wieWissel.textContent = t('cal.switch');
    wissel.classList.toggle('verborgen', !(state.me && state.wisselOpen));
    wisselNamen.textContent = '';
    for (const p of d.participants) {
      const b = el('button', p.id === state.me ? 'ik' : null, p.name);
      b.type = 'button';
      b.addEventListener('click', async () => {
        state.me = p.id;
        try { localStorage.setItem(LS.p(pollId), p.id); } catch {}
        state.wisselOpen = false;
        state.lastJson = '';
        await haalOp(true);
      });
      wisselNamen.append(b);
    }
    wisselIn.placeholder = t('cal.newName.ph');
    wisselOk.textContent = t('poll.next');

    kalHint.textContent = state.me ? t('cal.hint') : t('poll.nameFirst');
    lijstKop.textContent = t('list.title');
    wegBtn.textContent = t('poll.leave');
    wegJa.textContent = t('poll.leaveYes');
    wegNee.textContent = t('poll.leaveNo');
    wegZone.classList.toggle('verborgen', !state.me);

    bouwStatus();
    bouwKal();
    bouwLijst();
  }

  function schermOnbekend() {
    scherm.textContent = '';
    const kop = el('h1', null, t('notfound.title'));
    const tekst = el('p', null, t('notfound.text'));
    const knop = el('button', null, t('notfound.new'));
    knop.type = 'button';
    knop.addEventListener('click', () => { location.href = '/'; });
    scherm.append(kop, tekst, knop);
    hertaal = () => {
      kop.textContent = t('notfound.title');
      tekst.textContent = t('notfound.text');
      knop.textContent = t('notfound.new');
    };
  }

  async function haalOp(forceer) {
    let res, tekst;
    try {
      res = await fetch('/api/polls/' + pollId, { cache: 'no-store' });
      tekst = await res.text();
    } catch {
      return;
    }
    if (res.status === 404) {
      schermOnbekend();
      return;
    }
    if (!res.ok) return;
    if (!forceer && state.inflight > 0) return; // race: oudere data negeren
    if (tekst === state.lastJson) return;
    state.lastJson = tekst;
    state.data = JSON.parse(tekst);
    if (state.me && !state.data.participants.some((p) => p.id === state.me)) {
      state.me = null;
      try { localStorage.removeItem(LS.p(pollId)); } catch {}
    }
    render();
  }

  hertaal = render;

  haalOp(true);
  setInterval(() => haalOp(false), 10000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') haalOp(false);
  });
}

/* ---------- route ---------- */
const pad = location.pathname.replace(/\/+$/, '');
if (pad.startsWith('/p/') && pad.length > 3) {
  schermAfspraak(pad.slice(3));
} else {
  schermMaken();
}
</script>
</body>
</html>
